name: Select Xcode
description: Select a preferred Xcode version with fallback to the newest installed Xcode.

inputs:
  preferred-version:
    description: Preferred Xcode app name without .app (e.g. Xcode_16.4)
    required: false
    # 16.4 is the macos-15 default with preinstalled iOS simulators.
    # 16.2 often lacks the matching iOS platform on current runner images.
    default: Xcode_16.4

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        set -euo pipefail
        preferred="/Applications/${{ inputs.preferred-version }}.app"
        if [[ -d "$preferred" ]]; then
          sudo xcode-select -s "$preferred/Contents/Developer"
        else
          candidate="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$candidate" ]]; then
            candidate="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$candidate" ]]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Preferred ${{ inputs.preferred-version }} missing; using $candidate"
          sudo xcode-select -s "$candidate/Contents/Developer"
        fi
        # Warm CoreSimulator early (avoids flaky "Unable to connect to simulator").
        xcrun simctl list >/dev/null 2>&1 || true
        xcodebuild -version
        swift --version
