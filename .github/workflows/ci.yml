name: CI

# Runs on every push and every PR commit (all branches).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ios:
              - 'Sources/**'
              - 'Tests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'Samples/iOS/**'
              - '.swiftlint.yml'
              - '.swiftformat'
              - '.github/workflows/ios.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'VERSION'
              - 'scripts/**'
              - 'Makefile'
            android:
              - 'android/**'
              - 'VERSION'
              - 'scripts/**'
              - 'Makefile'
              - '.github/workflows/android.yml'
              - '.github/workflows/ci.yml'

  version:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check VERSION consistency
        run: ./scripts/check-version.sh

  ios:
    name: iOS
    needs: [changes, version]
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml

  android:
    name: Android
    needs: [changes, version]
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  # Single required check for branch protection: "CI / CI".
  result:
    name: CI
    needs: [changes, version, ios, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI result
        run: |
          set -euo pipefail
          echo "version=${{ needs.version.result }}"
          echo "ios=${{ needs.ios.result }}"
          echo "android=${{ needs.android.result }}"

          if [[ "${{ needs.version.result }}" != "success" ]]; then
            echo "Version check failed"
            exit 1
          fi

          for result in \
            "${{ needs.ios.result }}" \
            "${{ needs.android.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *)
                echo "A platform job failed (result=$result)"
                exit 1
                ;;
            esac
          done

          echo "CI passed"
