name: iOS

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Check version sync
        run: ./scripts/check-version.sh

      - name: Install SwiftLint & SwiftFormat
        uses: ./.github/actions/install-swift-tools

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: Resolve package
        run: |
          swift package resolve
          xcodebuild -list -scheme DivergeSDK || xcodebuild -list

      - name: Resolve package test destination
        id: pkg-dest
        uses: ./.github/actions/resolve-ios-destination
        with:
          scheme: DivergeSDK

      - name: iOS Simulator tests
        run: |
          xcodebuild test \
            -scheme DivergeSDK \
            -destination "${{ steps.pkg-dest.outputs.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve sample destination
        id: sample-dest
        uses: ./.github/actions/resolve-ios-destination
        with:
          scheme: DivergeSample
          project: Samples/iOS/DivergeSample.xcodeproj

      - name: Build iOS sample
        run: |
          xcodebuild build \
            -project Samples/iOS/DivergeSample.xcodeproj \
            -scheme DivergeSample \
            -destination "${{ steps.sample-dest.outputs.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
